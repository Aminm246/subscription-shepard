# H2 Database settings — in-memory, safe for Cloud Run's ephemeral filesystem
spring.datasource.url=jdbc:h2:mem:subscriptiondb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA and Hibernate settings for database tables
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# H2 web console disabled for the deployed version
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Cloud Run injects its own $PORT env var
server.port=${PORT:8080}

# Logging
logging.level.org.springframework=INFO
logging.level.edu.metro=DEBUG

server.error.whitelabel.enabled=false
